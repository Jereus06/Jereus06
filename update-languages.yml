name: Update Languages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Fetch languages from GitHub API
        id: languages
        run: |
          # Fetch all repos
          repos=$(curl -s "https://api.github.com/users/Jereus06/repos?per_page=100" | jq -r '.[].name')
          
          # Initialize variables
          declare -A lang_total
          total_bytes=0
          
          # Loop through each repo and get languages
          for repo in $repos; do
            langs=$(curl -s "https://api.github.com/repos/Jereus06/$repo/languages")
            for lang in $(echo $langs | jq -r 'keys[]'); do
              bytes=$(echo $langs | jq -r ".[\"$lang\"]")
              lang_total["$lang"]=$(( ${lang_total["$lang"]:-0} + $bytes ))
              total_bytes=$(( $total_bytes + $bytes ))
            done
          done
          
          # Calculate percentages and create markdown
          output="### 📊 Most Used Languages\n\n"
          for lang in "${!lang_total[@]}"; do
            percentage=$(echo "scale=2; ${lang_total[$lang]} * 100 / $total_bytes" | bc)
            output+="- **$lang**: $percentage%\n"
          done
          
          # Sort by percentage (highest first)
          output=$(echo -e "$output" | sort -rn -t':' -k2)
          
          # Update the README
          sed -i "/<!-- LANGUAGES_START -->/,/<!-- LANGUAGES_END -->/c\\<!-- LANGUAGES_START -->\n$output\n<!-- LANGUAGES_END -->" README.md
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Auto-update languages" || echo "No changes to commit"
          git push || echo "No changes to push"
