name: Update Languages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch languages and update README
        run: |
          # Fetch all repos
          repos=$(curl -s "https://api.github.com/users/Jereus06/repos?per_page=100" | jq -r '.[].name')
          
          declare -A lang_total
          total_bytes=0
          
          # Loop through each repo and get languages
          for repo in $repos; do
            langs=$(curl -s "https://api.github.com/repos/Jereus06/$repo/languages")
            for lang in $(echo "$langs" | jq -r 'keys[]'); do
              bytes=$(echo "$langs" | jq -r ".[\"$lang\"]")
              lang_total["$lang"]=$(( ${lang_total["$lang"]:-0} + bytes ))
              total_bytes=$(( total_bytes + bytes ))
            done
          done
          
          # Build clean language list (exactly like screenshot)
          output="### Most Used Languages\n\n"
          if [ $total_bytes -gt 0 ]; then
            # Sort by bytes (descending) and format
            for lang in $(for l in "${!lang_total[@]}"; do echo "${lang_total[$l]} $l"; done | sort -rn | awk '{print $2}'); do
              bytes=${lang_total[$lang]}
              percentage=$(echo "scale=2; $bytes * 100 / $total_bytes" | bc)
              # Fix percentage formatting (add leading zero)
              if [[ $percentage == .* ]]; then
                percentage="0$percentage"
              fi
              # Single line: "- Language Percentage%"
              output+="- $lang $percentage%\n"
            done
          else
            output+="- No languages detected yet\n"
          fi
          
          # Update README using Python
          python3 - <<EOF
          import re
          from pathlib import Path
          
          readme = Path("README.md")
          text = readme.read_text()
          
          start = "<!-- LANGUAGES_START -->"
          end = "<!-- LANGUAGES_END -->"
          output = """$output"""
          replacement = f"{start}\n{output}\n{end}"
          
          pattern = re.compile(rf"{start}.*?{end}", re.DOTALL)
          new_text = pattern.sub(replacement, text)
          readme.write_text(new_text)
          EOF
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "Update languages [skip ci]"
          git push || echo "No changes to push"
