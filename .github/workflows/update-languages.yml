name: Update Languages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch languages and create circle design
        run: |
          # Fetch all repos
          repos=$(curl -s "https://api.github.com/users/Jereus06/repos?per_page=100" | jq -r '.[].name')
          
          declare -A lang_total
          total_bytes=0
          
          for repo in $repos; do
            langs=$(curl -s "https://api.github.com/repos/Jereus06/$repo/languages")
            for lang in $(echo "$langs" | jq -r 'keys[]'); do
              bytes=$(echo "$langs" | jq -r ".[\"$lang\"]")
              lang_total["$lang"]=$(( ${lang_total["$lang"]:-0} + bytes ))
              total_bytes=$(( total_bytes + bytes ))
            done
          done
          
          # Emoji circles for languages
          declare -A emojis
          emojis["Python"]="🐍"
          emojis["JavaScript"]="🟨"
          emojis["TypeScript"]="🔵"
          emojis["PHP"]="🐘"
          emojis["HTML"]="🌐"
          emojis["CSS"]="🎨"
          emojis["C++"]="⚡"
          emojis["Go"]="🐹"
          emojis["Java"]="☕"
          emojis["Ruby"]="💎"
          emojis["Hack"]="🚀"
          emojis["Dockerfile"]="🐳"
          emojis["Batchfile"]="💻"
          
          # Colors for language badges
          declare -A colors
          colors["Python"]="blue"
          colors["JavaScript"]="yellow"
          colors["TypeScript"]="blue"
          colors["PHP"]="purple"
          colors["HTML"]="orange"
          colors["CSS"]="blue"
          colors["C++"]="blue"
          colors["Go"]="blue"
          colors["Hack"]="gray"
          colors["Dockerfile"]="blue"
          colors["Batchfile"]="gray"
          
          output='<div align="center">\n\n### 🎯 Languages Used\n\n'
          output+='<table>\n<tr>\n'
          
          count=0
          for lang in $(for l in "${!lang_total[@]}"; do echo "${lang_total[$l]} $l"; done | sort -rn | awk '{print $2}'); do
            bytes=${lang_total[$lang]}
            percentage=$(echo "scale=2; $bytes * 100 / $total_bytes" | bc)
            if [[ $percentage == .* ]]; then
              percentage="0$percentage"
            fi
            emoji="${emojis[$lang]:-📁}"
            color="${colors[$lang]:-gray}"
            
            # Create visual circle using emoji + percentage
            output+='<td align="center" style="padding: 10px;">\n'
            output+='  <div style="font-size: 40px;">'$emoji'</div>\n'
            output+='  <div style="font-size: 18px; font-weight: bold; color: #333;">'$percentage'%</div>\n'
            output+='  <div style="font-size: 14px; color: #666;">'$lang'</div>\n'
            output+='  <div style="margin-top: 5px; width: 60px; height: 4px; background: #e0e0e0; border-radius: 2px; margin-left: auto; margin-right: auto;">\n'
            output+='    <div style="width: '$percentage'%; height: 4px; background: '$color'; border-radius: 2px;"></div>\n'
            output+='  </div>\n'
            output+='</td>\n'
            
            count=$((count + 1))
            if [ $((count % 4)) -eq 0 ]; then
              output+='</tr>\n<tr>\n'
            fi
          done
          output+='</tr>\n</table>\n</div>\n'
          
          python3 - <<EOF
          import re
          from pathlib import Path
          
          readme = Path("README.md")
          text = readme.read_text()
          
          start = "<!-- LANGUAGES_START -->"
          end = "<!-- LANGUAGES_END -->"
          output = """$output"""
          replacement = f"{start}\n{output}\n{end}"
          
          pattern = re.compile(rf"{start}.*?{end}", re.DOTALL)
          new_text = pattern.sub(replacement, text)
          readme.write_text(new_text)
          EOF
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "Update languages with emoji circles [skip ci]"
          git push || echo "No changes to push"
