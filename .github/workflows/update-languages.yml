name: Update Languages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch languages from GitHub API
        run: |
          # Fetch all repos
          repos=$(curl -s "https://api.github.com/users/Jereus06/repos?per_page=100" | jq -r '.[].name')
          
          # Initialize arrays
          declare -A lang_total
          total_bytes=0
          
          # Loop through each repo and get languages
          for repo in $repos; do
            langs=$(curl -s "https://api.github.com/repos/Jereus06/$repo/languages")
            for lang in $(echo "$langs" | jq -r 'keys[]'); do
              bytes=$(echo "$langs" | jq -r ".[\"$lang\"]")
              lang_total["$lang"]=$(( ${lang_total["$lang"]:-0} + bytes ))
              total_bytes=$(( total_bytes + bytes ))
            done
          done
          
          # Build the output
          output="### 📊 Most Used Languages\n\n"
          if [ $total_bytes -gt 0 ]; then
            for lang in "${!lang_total[@]}"; do
              percentage=$(echo "scale=2; ${lang_total[$lang]} * 100 / $total_bytes" | bc)
              output+="- **$lang**: $percentage%\n"
            done
          else
            output+="- No languages detected yet\n"
          fi
          
          # Use Python to update README
          python3 - <<EOF
          import re
          from pathlib import Path
          
          # Read the README
          readme = Path("README.md")
          text = readme.read_text()
          
          # Define the markers
          start = "<!-- LANGUAGES_START -->"
          end = "<!-- LANGUAGES_END -->"
          
          # Get the output from shell
          output = """$output"""
          
          # Create the replacement
          replacement = f"{start}\n{output}\n{end}"
          
          # Replace everything between the markers
          pattern = re.compile(rf"{start}.*?{end}", re.DOTALL)
          new_text = pattern.sub(replacement, text)
          
          # Write back
          readme.write_text(new_text)
          EOF
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "Auto-update languages [skip ci]"
          git push || echo "No changes to push"
