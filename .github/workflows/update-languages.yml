name: Update Languages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch languages and update README
        run: |
          # Get all repos
          repos=$(curl -s "https://api.github.com/users/Jereus06/repos?per_page=100" | jq -r '.[].name')
          
          # Create the language list
          echo "### 📊 Most Used Languages" > languages.txt
          echo "" >> languages.txt
          
          # Loop through each repo
          for repo in $repos; do
            langs=$(curl -s "https://api.github.com/repos/Jereus06/$repo/languages")
            for lang in $(echo $langs | jq -r 'keys[]'); do
              bytes=$(echo $langs | jq -r ".[\"$lang\"]")
              echo "$lang $bytes" >> temp.txt
            done
          done
          
          # Calculate totals
          if [ -f temp.txt ]; then
            total=$(awk '{sum+=$2} END {print sum}' temp.txt)
            if [ "$total" -gt 0 ]; then
              awk -v total="$total" '{lang[$1]+=$2} END {for (l in lang) printf "- **%s**: %.2f%%\n", l, (lang[l]/total)*100}' temp.txt | sort -rn -t':' -k2 >> languages.txt
            else
              echo "- No languages detected yet" >> languages.txt
            fi
            rm temp.txt
          else
            echo "- No languages detected yet" >> languages.txt
          fi
          
          # Read the content
          content=$(cat languages.txt)
          
          # Use Python to update README (more reliable than sed)
          python3 -c "
import re
with open('README.md', 'r') as f:
    content = f.read()
start = '<!-- LANGUAGES_START -->'
end = '<!-- LANGUAGES_END -->'
new_content = '''$content'''
pattern = re.compile(r'$start.*?$end', re.DOTALL)
with open('README.md', 'w') as f:
    f.write(pattern.sub(f'$start\n{new_content}\n$end', content))
"
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "Auto-update languages [skip ci]"
          git push || echo "No changes to push"
