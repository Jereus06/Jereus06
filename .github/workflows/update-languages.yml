name: Update Languages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch languages and create circle design
        run: |
          # Fetch all repos
          repos=$(curl -s "https://api.github.com/users/Jereus06/repos?per_page=100" | jq -r '.[].name')
          
          declare -A lang_total
          total_bytes=0
          
          for repo in $repos; do
            langs=$(curl -s "https://api.github.com/repos/Jereus06/$repo/languages")
            for lang in $(echo "$langs" | jq -r 'keys[]'); do
              bytes=$(echo "$langs" | jq -r ".[\"$lang\"]")
              lang_total["$lang"]=$(( ${lang_total["$lang"]:-0} + bytes ))
              total_bytes=$(( total_bytes + bytes ))
            done
          done
          
          # Colors for languages
          declare -A colors
          colors["Python"]="#3776AB"
          colors["JavaScript"]="#F7DF1E"
          colors["TypeScript"]="#3178C6"
          colors["PHP"]="#777BB4"
          colors["HTML"]="#E34F26"
          colors["CSS"]="#1572B6"
          colors["C++"]="#00599C"
          colors["Go"]="#00ADD8"
          colors["Java"]="#007396"
          colors["Ruby"]="#CC342D"
          colors["Hack"]="#878787"
          colors["Dockerfile"]="#2496ED"
          colors["Batchfile"]="#4D4D4D"
          
          # Build HTML/CSS circle design
          output='<div align="center">\n\n### 🎯 Languages Used\n\n'
          output+='<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">\n'
          
          for lang in $(for l in "${!lang_total[@]}"; do echo "${lang_total[$l]} $l"; done | sort -rn | awk '{print $2}'); do
            bytes=${lang_total[$lang]}
            percentage=$(echo "scale=2; $bytes * 100 / $total_bytes" | bc)
            if [[ $percentage == .* ]]; then
              percentage="0$percentage"
            fi
            color="${colors[$lang]:-#888888}"
            
            # Create circle with color
            output+='  <div style="text-align: center;">\n'
            output+='    <div style="\n'
            output+='      width: 80px;\n'
            output+='      height: 80px;\n'
            output+='      border-radius: 50%;\n'
            output+='      background: conic-gradient('$color' 0% '$percentage'%, #e0e0e0 '$percentage'% 100%);\n'
            output+='      display: flex;\n'
            output+='      align-items: center;\n'
            output+='      justify-content: center;\n'
            output+='      margin: 0 auto;\n'
            output+='      position: relative;\n'
            output+='    ">\n'
            output+='      <div style="\n'
            output+='        width: 55px;\n'
            output+='        height: 55px;\n'
            output+='        border-radius: 50%;\n'
            output+='        background: white;\n'
            output+='        display: flex;\n'
            output+='        align-items: center;\n'
            output+='        justify-content: center;\n'
            output+='        font-weight: bold;\n'
            output+='        font-size: 14px;\n'
            output+='        color: #333;\n'
            output+='      ">\n'
            output+='        '$percentage'%\n'
            output+='      </div>\n'
            output+='    </div>\n'
            output+='    <div style="margin-top: 8px; font-weight: bold; font-size: 14px; color: #333;">'$lang'</div>\n'
            output+='    <div style="font-size: 12px; color: #666;">'$color'</div>\n'
            output+='  </div>\n'
          done
          
          output+='</div>\n</div>\n'
          
          # Use Python to update README
          python3 - <<EOF
          import re
          from pathlib import Path
          
          readme = Path("README.md")
          text = readme.read_text()
          
          start = "<!-- LANGUAGES_START -->"
          end = "<!-- LANGUAGES_END -->"
          output = """$output"""
          replacement = f"{start}\n{output}\n{end}"
          
          pattern = re.compile(rf"{start}.*?{end}", re.DOTALL)
          new_text = pattern.sub(replacement, text)
          readme.write_text(new_text)
          EOF
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "Update languages with circles [skip ci]"
          git push || echo "No changes to push"
